name: nginx 1732 list reuse experiment
on:
  push:
    branches: [research/issue-1732-list-reuse]
    paths:
      - src/http/ngx_http_upstream.c
      - research/issue-1732/list_reuse_probe.py
      - .github/workflows/nginx-1732-list-reuse.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libpcre2-dev libssl-dev zlib1g-dev
      - name: Compile prototype
        run: |
          ./auto/configure --with-http_ssl_module --with-http_v2_module --with-debug
          make -j2
          ./objs/nginx -V
      - name: Validate normal final status and memory trends
        run: python3 research/issue-1732/list_reuse_probe.py
